<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ascendra - Log In</title>
</head>

<body>

    <h1>
        Welcome back to <strong id="appname">Ascendra</strong>!
    </h1>

    <h2 id="log_in">
        Log in
    </h2>

    <form method="post" id="login">

        <input
            type="text"
            placeholder="Username"
            id="name"
            autocomplete="username"
            required
        >

        <br><br>

        <input
            type="password"
            placeholder="Password"
            id="password"
            autocomplete="current-password"
            required
        >

        <br><br>

        <p>
            Don't have an account?
            <a href="signup.html">Sign up</a>
        </p>

        <br>

        <input
            type="submit"
            value="Log In"
        >

    </form>

    <script src="login.js"></script>

</body>

</html>
