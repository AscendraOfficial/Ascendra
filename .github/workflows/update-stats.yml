name: Update Ascendra Stats

on:
  push:
    branches: [real]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Count code lines
        run: python count_lines.py

      - name: Show changes
        run: git diff -- docs/stats.md

      - name: Save updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/stats.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: update Ascendra stats"
            git push
          fi
