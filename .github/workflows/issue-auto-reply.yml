name: Ascendra daily issue acknowledgments

on:
  schedule:
    # 4 AM Edmonton: 10:00 UTC in daylight time, 11:00 UTC in standard time.
    - cron: '0 10,11 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  acknowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge new issues once
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const edmontonHour = Number(new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/Edmonton', hour: '2-digit', hourCycle: 'h23'
            }).format(now));
            // Scheduled runs only at 4 AM Edmonton; manual runs are allowed for testing.
            if (context.eventName === 'schedule' && edmontonHour !== 4) return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const bot = 'github-actions[bot]';
            const cutoff = Date.now() - 30 * 60 * 60 * 1000;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', sort: 'created', direction: 'desc', per_page: 100
            });
            let posted = 0;
            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (new Date(issue.created_at).getTime() < cutoff) break;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100
              });
              if (comments.some(c => c.user?.login === bot &&
                  c.body?.includes('<!-- ascendra-auto-ack -->'))) continue;

              const body = [
                '<!-- ascendra-auto-ack -->',
                'Thanks for opening this issue and helping improve Ascendra! 💜',
                '',
                'The team will review it when available. If this is a bug, please include',
                'the steps to reproduce it, what you expected, what happened instead,',
                'and your browser/device (without sharing passwords or private data).',
                '',
                '*This is an automatic acknowledgment, not a confirmation that a fix is ready.*'
              ].join('\n');
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body
              });
              posted++;
              if (posted >= 10) break; // Prevent unexpected mass commenting.
            }
            core.info(`Posted ${posted} acknowledgments.`);
