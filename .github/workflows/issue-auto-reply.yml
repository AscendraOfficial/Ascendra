name: Ascendra feedback issue replies

on:
  schedule:
    # 4 AM Edmonton: 10:00 UTC in daylight time, 11:00 UTC in standard time.
    - cron: '0 10,11 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Reply to new feedback comments on issue 16
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const edmontonHour = Number(new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/Edmonton', hour: '2-digit', hourCycle: 'h23'
            }).format(now));
            if (context.eventName === 'schedule' && edmontonHour !== 4) return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = 16;
            const bot = 'github-actions[bot]';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const replied = new Set();
            for (const comment of comments) {
              const matches = comment.body?.match(/<!-- ascendra-feedback-reply:(\d+) -->/);
              if (comment.user?.login === bot && matches) replied.add(Number(matches[1]));
            }
            let count = 0;
            for (const comment of comments) {
              if (comment.user?.type === 'Bot' || replied.has(comment.id)) continue;
              if (count >= 10) break;
              const body = [
                `<!-- ascendra-feedback-reply:${comment.id} -->`,
                `Thanks for your feedback, @${comment.user.login}! 💜`,
                '',
                'The Ascendra team will review your comment when available.',
                'If you are reporting a bug, please include steps to reproduce it,',
                'what you expected, and your browser/device. Please do not share passwords',
                'or private information.',
                '',
                '*Automated acknowledgment — this does not mean the issue is fixed.*'
              ].join('\n');
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
              count++;
            }
            core.info(`Replied to ${count} feedback comments on issue #16.`);
