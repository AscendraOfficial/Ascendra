<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Sprint</title>
  <link rel="stylesheet" href="focus-sprint.css">
  <script src="focus-sprint.js" defer></script>
</head>
<body>
  <main class="focus-card">
    <h1>Focus Sprint</h1>
    <p>Pick a time and focus.</p>

    <div class="time" id="timeDisplay">05:00</div>

    <div class="buttons">
      <button id="fiveMinutes">5 min</button>
      <button id="fifteenMinutes">15 min</button>
      <button id="twentyFiveMinutes">25 min</button>
    </div>

    <div class="buttons controls">
      <button class="primary" id="startButton">Start</button>
      <button id="resetButton">Reset</button>
    </div>

    <p class="status" id="statusText">Ready.</p>
  </main>
</body>
</html>
