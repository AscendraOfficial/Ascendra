<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kids Mode Setup</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="setup-container">
      <header class="setup-header">
        <h1>Kids Mode Setup</h1>
        <p>Let's set up your Ascendra character!</p>
      </header>

      <section class="setup-card">
        <!-- STEP 1 -->

        <div class="setup-step active" id="step1">
          <h2>What's <strong>your</strong> name?</h2>

          <input type="text" id="characterName" placeholder="Enter your name" />

          <h2>What's you <strong>characters</strong> name?</h2>

          <input
            type="text"
            id="characterName"
            placeholder="Enter your character's name"
          />
        </div>

        <button class="next-button" id="step1Next">Next</button>
        <!-- TODO: Add functionality -->

        <!-- STEP 2 -->

        <div class="setup-step" id="step2">
          <h2>Choose a shirt</h2>

          <div class="character-preview">
            <img id="leftSleeve" alt="Left sleeve" />

            <img id="shirtImage" alt="Shirt" />

            <img id="rightSleeve" alt="Right sleeve" />
          </div>

          <div class="shirt-options">
            <button class="shirt-option" data-shirt="orange">Orange</button>

            <button class="shirt-option" data-shirt="green">Green</button>

            <button class="shirt-option" data-shirt="purple">Purple</button>

            <button class="shirt-option" data-shirt="blue">Blue</button>
          </div>

          <button id="finishButton">Finish</button>
        </div>

        <!-- PROGRESS -->

        <div class="progress">
          <div class="progress-dot active" id="dot1"></div>

          <div class="progress-dot" id="dot2"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
