<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Ascendra - Extras</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="extras.css">
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Extras</h1>

        <!-- These buttons lead to links -->
        <div id="button-container">
            <!-- time capsule -->
            <button onclick="window.location.href='comingsoon.html'" class="options" id="time-capsule">Time Capsule<br><i class="fa-solid fa-hourglass-half"></i></button>

            <!-- study time -->
            <button onclick="window.location.href='comingsoon.html'" class="options" id="soundscape">Soundscape<br><i class="fa-solid fa-music"></i></button>

            <!-- zen timer -->
            <!-- badges: a moment of zen and zen regular -->
            <button onclick="window.location.href='comingsoon.html'" class="options" id="unwind">Unwind<br><i class="fa-solid fa-cloud-moon"></i></button>

            <!-- achievements -->
            <!-- Shows all xp, badges and maybe coins and merchendice in the future -->
            <button onclick="window.location.href='achievements.html'" class="options" id="achievements">Achievements<br><i class="fa-solid fa-medal"></i></button>

            <!-- mini tools: dice, number generator and coin flip. -->
            <!-- Badges: Heads or tails?, roll with it, by the numbers. -->
            <button onclick="window.location.href='minitools.html'" class="options" id="mini-tools">Mini Tools<br><i class="fa-solid fa-gamepad"></i></button>
        </div>
    </body>

</html>
