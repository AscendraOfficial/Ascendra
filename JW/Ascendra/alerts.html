<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ascendra - Alerts</title>

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="alerts.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <div class="alerts-page">

        <header class="alerts-header">

            <div class="header-icon">
                <i class="fa-solid fa-bell"></i>
            </div>

            <div>
                <h1>Alerts</h1>
                <p>For convenience and notifications</p>
            </div>

        </header>

        <section class="alert-summary">

            <div class="summary-icon">
                <i class="fa-solid fa-bolt"></i>
            </div>

            <div>
                <span class="summary-label">ALERT STATUS</span>

                <h2 id="alertSummary">
                    Checking your alerts...
                </h2>
            </div>

        </section>

        <main id="alertList">
        </main>

    </div>


    <nav class="navbar">

        <button onclick="window.location.href='home.html'">
            <i class="fa-solid fa-mug-saucer"></i>
            <span>Home</span>
        </button>

        <button class="current">
            <i class="fa-solid fa-bell"></i>
            <span>Alerts</span>
        </button>

        <button onclick="window.location.href='todos.html'">
            <i class="fa-solid fa-list-check"></i>
            <span>To-Dos</span>
        </button>

        <button onclick="window.location.href='habits.html'">
            <i class="fa-solid fa-thumbs-up"></i>
            <span>Habits</span>
        </button>

        <button onclick="window.location.href='breathing.html'">
            <i class="fa-solid fa-wind"></i>
            <span>Breathing</span>
        </button>

        <button onclick="window.location.href='calendar.html'">
            <i class="fa-solid fa-calendar"></i>
            <span>Calendar</span>
        </button>

        <button onclick="window.location.href='journal.html'">
            <i class="fa-solid fa-book-open"></i>
            <span>Journal</span>
        </button>

        <button onclick="window.location.href='menu.html'">
            <i class="fa-solid fa-bars-staggered"></i>
            <span>Menu</span>
        </button>

    </nav>


    <script src="alerts.js"></script>
    <script src="global-settings.js"></script>

</body>
</html>
