<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="character(KidsMode).css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Ascendra - character</title>
</head>

<body>

    <button onclick="window.location.href='merchandise.html'" class="go_back">
        go back
    </button>

    <h1 id="character-heading">Character</h1>

    <h3 id="character-subtitle">
        to change and tinker with
    </h3>

      <section id="character-selector">
    
            <h2>Choose your character</h2>
    
            <div class="character-scroll">
    
    
            <!-- MOOSE -->
    
            <button class="character-box active" id="moose-character">
    
                <div class="character-preview" id="moose-preview">
                </div>
    
                <div>
                    <h3>Moose</h3>
                    <p>Ascendra Moose</p>
                </div>
    
            </button>
    
    
            <!-- FOX -->
    
            <button class="character-box" id="fox-character">
    
                <div class="character-preview">
                    🦊
                </div>
    
                <div>
                    <h3>Fox</h3>
                    <p>Ascendra Fox</p>
                </div>
    
            </button>
    
    
            <!-- CAT -->
    
            <button class="character-box">
    
                <div class="character-preview">
                    🐱
                </div>
    
                <div>
                    <h3>Cat</h3>
                    <p>Coming soon</p>
                </div>
    
            </button>
    
    
            <!-- BEAR -->
    
            <button class="character-box">
    
                <div class="character-preview">
                    🐻
                </div>
    
                <div>
                    <h3>Bear</h3>
                    <p>Coming soon</p>
                </div>
    
            </button>
    
    
            <!-- KOALA -->
    
            <button class="character-box">
    
                <div class="character-preview">
                    🐨
                </div>
    
                <div>
                    <h3>Koala</h3>
                    <p>Coming soon</p>
                </div>
    
            </button>
    
    
            <!-- PENGUIN -->
    
            <button class="character-box">
    
                <div class="character-preview">
                    🐧
                </div>
    
                <div>
                    <h3>Penguin</h3>
                    <p>Coming soon</p>
                </div>
    
            </button>
    
    
        </div>
    
    </section>

    <!-- p5.js -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>

    <!-- Ascendra Kids Mode JavaScript -->
    <script type="module" src="./responses(KidsMode).js"></script>

</body>
</html>
