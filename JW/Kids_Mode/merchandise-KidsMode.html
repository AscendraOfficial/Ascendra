<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Ascendra - Merchandise</title>

    <link rel="stylesheet" href="coin-KidsMode.css">
    <link rel="stylesheet" href="merchandise-KidsMode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <!-- Button leading to the page 'Merch' -->
    <button onclick="window.location.href='merch-KidsMode.html'" id="merch-button">
        <h2 class="merchandise-button-h2">Merch <i class="fa-solid fa-shirt"></i></h2>
        <p class="merchandise-button-p">This is where you can review and equip all of the things
        you bought from the shop.</p>
    </button>

    <!-- Button leading to the page 'Shop' -->
    <button onclick="window.location.href='shop-KidsMode.html'" id="shop-button">
        <h2 class="merchandise-button-h2">Shop <i class="fa-solid fa-coins"></i></h2>
        <p class="merchandise-button-p">This is where you can buy all of your clothing or accessories.
        You'll need coins to be able to buy things in the shop.</p>
    </button>

    <!-- Button leading to the page 'Character' -->
    <button onclick="window.location.href='character-KidsMode.html'" id="character-button">
        <h2 class="merchandise-button-h2">Character <i class="fa-solid fa-users"></i></h2>
        <p class="merchandise-button-p">This is where you can change your base character. You can
        make your character more unique with this function!</p>
    </button>
    
    <!-- MAIN ASCENDRA NAVIGATION -->

    <div class="navbar">

        <button onclick="window.location.href='home-KidsMode.html'">
            <i class="fa-solid fa-mug-saucer"></i><br>
            Home
        </button>

        <button onclick="window.location.href='alerts-KidsMode.html'">
            <i class="fa-regular fa-bell"></i><br>
            Alerts
        </button>

        <button onclick="window.location.href='todos-KidsMode.html'">
            <i class="fa-solid fa-list-check"></i><br>
            To-Dos
        </button>

        <button onclick="window.location.href='habits-KidsMode-.html'">
            <i class="fa-regular fa-thumbs-up"></i><br>
            Habits
        </button>

        <button onclick="window.location.href='breathing-KidsMode.html'">
            <i class="fa-solid fa-wind"></i><br>
            Breathing
        </button>

        <button onclick="window.location.href='calendar-KidsMode.html'">
            <i class="fa-regular fa-calendar"></i><br>
            Calendar
        </button>

        <button onclick="window.location.href='journal-KidsMode.html'">
            <i class="fa-solid fa-book-open"></i><br>
            Journal
        </button>

        <button onclick="window.location.href='menu-KidsMode.html'">
            <i class="fa-solid fa-bars-staggered"></i><br>
            Menu
        </button>

        <button class="current">
            <i class="fa-solid fa-shirt"></i><br>
            Merchandise
        </button>
    </div>

     <div class="coin-display">

        <div class="ascendra-coin">
            <span class="coin-letter">A</span>
        </div>

        <span class="coin-balance">0</span>

    </div>

    <script src="coin-KidsMode.js"></script>
</body>

</html>
