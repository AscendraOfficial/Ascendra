<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Ascendra - My Calendar</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="calendar.css">
  
    <link rel="stylesheet" href="settings(KidsMode).css">

    <link rel="icon" type="image/x-icon" href="favicon.png">
</head>

<body>
    <div class="calendar-container">

        <div class="top-title">
            <h1>Calendar</h1>
            <!-- add event button -->
            <button class="addEvent">+ Add Event</button>
    </div>

    <div class="calendar-card">
        <div class="calendar-header">
            <!-- buttons to go to previous month or the next month -->
            <span id="prevMonth">‹</span>
            <h2></h2>
            <span id="nextMonth">›</span>
        </div>
    
        <table>
            <!-- days of the week -->
            <thead>
                <tr>
                    <th>Sun</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                    <th>Sat</th>
                </tr>
            </thead>
    
            <tbody id="calendarBody"></tbody>
        </table>
    </div>

    <!-- You will see these inputs when you press "+ Add Event" -->
    <div id="eventPopup" class="popup">
        <h2>New Event</h2>

        <input id="eventTitle" type="text" placeholder="Event name">
        <input id="eventDate" type="text" placeholder="Choose date">

        <button id="saveEvent">Save</button>
        <button id="closePopup">Close</button>
    </div>

    
    <!-- bottom navigator bar -->
    <div class="navbar">
        <button onclick="window.location.href='home.html'">
            <i class="fa-solid fa-mug-saucer"></i>
            <span>Home</span>
        </button>

        <button onclick="window.location.href='alerts(KidsMode).html'">
            <i class="fa-solid fa-bell"></i>
            <span>Alerts</span>
        </button>

        <button onclick="window.location.href='todos(KidsMode).html'">
            <i class="fa-solid fa-list-check"></i>
            <span>To-Dos</span>
        </button>

        <button onclick="window.location.href='habits(KidsMode).html'">
            <i class="fa-solid fa-thumbs-up"></i>
            <span>Habits</span>
        </button>

        <button onclick="window.location.href='breathing(KidsMode).html'">
            <i class="fa-solid fa-wind"></i>
            <span>Breathing</span>
        </button>

        <button class="current">
            <i class="fa-solid fa-calendar"></i>
            <span>Calendar</span>
        </button>

        <button onclick="window.location.href='journal(KidsMode).html'">
            <i class="fa-solid fa-book-open"></i>
            <span>Journal</span>
        </button>

        <button onclick="window.location.href='merchandise(KidsMode).html'">
            <i class="fa-solid fa-shirt"></i>
            <span>Merchandise</span>
        </button>
        
        <button onclick="window.location.href='menu(KidsMode).html'">
            <i class="fa-solid fa-bars-staggered"></i>
            <span>Menu</span>
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="calendar(KidsMode).js"></script>

    <script src="global-settings(KidsMode).js"></script>

</body>
</html>
