<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Merchandise 👕</title>

    <link rel="stylesheet" href="merchandise(KidsMode).css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="main-box">

        <!-- HOME SECTION -->

        <section id="homeSection" class="page-section">

            <h1>Kids Mode</h1>

            <p>Welcome to your Ascendra character!</p>

        </section>


        <!-- CHARACTER SECTION -->

        <section id="characterSection" class="page-section">

            <h1>Character</h1>

            <p>Customize your character here.</p>

        </section>


        <!-- MERCHANDISE SECTION -->

        <section id="merchandiseSection" class="page-section">

            <h1 id="merchandise">
                Merchandise 👕
            </h1>

            <h3 id="merchandise_subtitle">
                to make your character cool and unique
            </h3>

            <div class="merchandise-content">

                <p>
                    Your merchandise will appear here.
                </p>

            </div>

        </section>


        <!-- SHOP SECTION -->

        <section id="shopSection" class="page-section">

            <h1>Shop</h1>

            <p>Spend your coins on cool items!</p>

        </section>


        <!-- NAVIGATION -->

        <nav class="box-navbar">

            <button onclick="showSection('homeSection')">
                Home
            </button>

            <button onclick="showSection('characterSection')">
                Character
            </button>

            <button onclick="showSection('merchandiseSection')">
                Merchandise
            </button>

            <button onclick="showSection('shopSection')">
                Shop
            </button>

        </nav>

    </div>

    <div class="navbar">
        <button onclick="window.location.href='home.html'"><i class="fa-solid fa-mug-saucer"></i><br>Home</button>
        <button onclick="window.location.href='alerts.html'"><i class="fa-regular fa-bell"></i><br>Alerts</button>
        <button onclick="window.location.href='todos.html'"><i class="fa-solid fa-list-check"></i><br>To-Dos</button>
        <button onclick="window.location.href='habits.html'"><i class="fa-regular fa-thumbs-up"></i><br>Habits</button>
        <button onclick="window.location.href='breathing.html'"><i class="fa-solid fa-wind"></i><br>Breathing</button>
        <button onclick="window.location.href='calendar.html'"><i class="fa-regular fa-calendar"></i><br>Calendar</button>
        <button onclick="window.location.href='journal.html'"><i class="fa-solid fa-book-open"></i><br>Journal</button>
        <button onclick="window.location.href='menu.html'"><i class="fa-solid fa-bars-staggered"></i><br>Menu</button>
        <button class="current"><i class="fa-solid fa-shirt"></i><br>Merch</button>
    </div>
    
    <script src="merchandise(KidsMode).js"></script>

</body>

</html>
