<template id="page-login">
      <form id="login">
        <h1>Welcome back to <a id="ascendraLogo">Ascendra!</a></h1>
        <h2>Log In</h2>
        <input aria-label="Username" autocomplete="username" id="username" maxlength="60" placeholder="Username" required="" type="text" />
        <br /><br />
        <input
          aria-label="Password"
          autocomplete="current-password"
          id="password"
          maxlength="128"
          placeholder="Password"
          required=""
          type="password"
        />
        <br /><br />
        <input type="submit" value="Log In" />
        <br /><br />
        <p>Don't have an account? <a href="#/signup">Sign up</a></p>
      </form>
    </template>
